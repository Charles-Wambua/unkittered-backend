# ElasticMQ: a small SQS-compatible server, localhost only.
include classpath("application.conf")

node-address {
  protocol = http
  host = 127.0.0.1
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "127.0.0.1"
  sqs-limits = strict
}

rest-stats.enabled = false

queues {
  unkittered-match-events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 10 seconds
  }
}
