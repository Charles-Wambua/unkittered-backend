# Test every push and PR; on main, ship the tested jar to the GCP VM.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   VM_HOST     the VM's external IP or hostname
#   VM_USER     the SSH user setup-vm.sh allowed to run `sudo unkittered-deploy`
#   VM_SSH_KEY  that user's private key (the public half in ~/.ssh/authorized_keys)
# Optional repository variable:
#   DEPLOY_ENABLED = true   (deploys are skipped until you set this)
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: mvn -B -q package
      - uses: actions/upload-artifact@v4
        with:
          name: unkittered-api
          path: target/unkittered-api-*.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unkittered-api
      - name: Ship to the VM and deploy
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          JAR=$(ls unkittered-api-*.jar | grep -v '\.original$' | head -1)
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/id_deploy $VM_USER@$VM_HOST"
          scp -i ~/.ssh/id_deploy "$JAR" "$VM_USER@$VM_HOST:/tmp/unkittered-api.jar"
          $SSH 'sudo /usr/local/sbin/unkittered-deploy --jar /tmp/unkittered-api.jar && rm -f /tmp/unkittered-api.jar'
