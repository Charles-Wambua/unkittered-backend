server:
  port: 8081
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: unkittered-api

spring:
  application:
    name: unkittered-api

  servlet:
    multipart:
      max-file-size: ${UNKITTERED_MAX_UPLOAD:8MB}
      max-request-size: ${UNKITTERED_MAX_REQUEST:10MB}

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/unkittered}
    username: ${DB_USERNAME:unkittered}
    password: ${DB_PASSWORD:unkittered}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

# AWS / SQS (LocalStack by default for local dev)
spring.cloud.aws:
  region:
    static: ${AWS_REGION:us-east-1}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  sqs:
    endpoint: ${AWS_SQS_ENDPOINT:http://localstack:4566}

unkittered:
  auth:
    # Log password-reset codes (local development only: no email sender yet).
    log-reset-codes: ${UNKITTERED_LOG_RESET_CODES:false}
  mpesa:
    # disabled | dev (LOCAL ONLY: payments "succeed" with no money moving) | daraja
    mode: ${UNKITTERED_MPESA_MODE:disabled}
    base-url: ${UNKITTERED_MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
    consumer-key: ${UNKITTERED_MPESA_CONSUMER_KEY:}
    consumer-secret: ${UNKITTERED_MPESA_CONSUMER_SECRET:}
    shortcode: ${UNKITTERED_MPESA_SHORTCODE:}
    passkey: ${UNKITTERED_MPESA_PASSKEY:}
    # Public https base Safaricom can reach, e.g. https://api.unkittered.app
    callback-base-url: ${UNKITTERED_MPESA_CALLBACK_BASE_URL:}
    # Long random secret; it becomes part of the callback URLs.
    callback-token: ${UNKITTERED_MPESA_CALLBACK_TOKEN:}
    b2c-shortcode: ${UNKITTERED_MPESA_B2C_SHORTCODE:}
    initiator-name: ${UNKITTERED_MPESA_INITIATOR_NAME:}
    security-credential: ${UNKITTERED_MPESA_SECURITY_CREDENTIAL:}
  payments:
    # Money rules (1 earned Paw = KES 1).
    creator-share: ${UNKITTERED_CREATOR_SHARE:0.5}
    withdrawal-fee-percent: ${UNKITTERED_WITHDRAWAL_FEE_PERCENT:0.15}
    withdrawal-fee-fixed: ${UNKITTERED_WITHDRAWAL_FEE_FIXED:0}
    min-withdrawal: ${UNKITTERED_MIN_WITHDRAWAL:500}
    # Days gift earnings wait before they can be withdrawn (refund/chargeback cover).
    hold-days: ${UNKITTERED_EARNINGS_HOLD_DAYS:7}
    # net: creators earn a share of what was actually paid, after store fees.
    # face: 1 Paw = KES 1 regardless (can pay out more than was received).
    earnings-basis: ${UNKITTERED_EARNINGS_BASIS:net}
    kes-per:
      KES: 1
      USD: ${UNKITTERED_KES_PER_USD:130}
      EUR: ${UNKITTERED_KES_PER_EUR:140}
      GBP: ${UNKITTERED_KES_PER_GBP:165}
    # Each provider: mode disabled | sandbox (no money moves) | live, the
    # countries it's offered in ("*" = all), what it's for, and whether it may
    # be offered inside the app for buying Paws (store rules: usually only
    # Google Play / App Store may sell in-app currency).
    providers:
      mpesa:
        # auto = follow unkittered.mpesa.mode (dev → sandbox, daraja → live).
        mode: ${UNKITTERED_PAY_MPESA:auto}
        countries: ${UNKITTERED_PAY_MPESA_COUNTRIES:KE}
        top-ups: true
        payouts: true
        in-app: ${UNKITTERED_PAY_MPESA_IN_APP:true}
        fee-percent: ${UNKITTERED_PAY_MPESA_FEE:0}
      google-play:
        mode: ${UNKITTERED_PAY_GOOGLE_PLAY:disabled}
        countries: ${UNKITTERED_PAY_GOOGLE_PLAY_COUNTRIES:*}
        top-ups: true
        in-app: true
        fee-percent: ${UNKITTERED_PAY_GOOGLE_PLAY_FEE:0.15}
      app-store:
        mode: ${UNKITTERED_PAY_APP_STORE:disabled}
        countries: ${UNKITTERED_PAY_APP_STORE_COUNTRIES:*}
        top-ups: true
        in-app: true
        fee-percent: ${UNKITTERED_PAY_APP_STORE_FEE:0.15}
      card:
        mode: ${UNKITTERED_PAY_CARD:disabled}
        countries: ${UNKITTERED_PAY_CARD_COUNTRIES:*}
        top-ups: true
        in-app: ${UNKITTERED_PAY_CARD_IN_APP:false}
        fee-percent: ${UNKITTERED_PAY_CARD_FEE:0.04}
      paypal:
        mode: ${UNKITTERED_PAY_PAYPAL:disabled}
        countries: ${UNKITTERED_PAY_PAYPAL_COUNTRIES:*}
        payouts: true
      bank:
        mode: ${UNKITTERED_PAY_BANK:disabled}
        countries: ${UNKITTERED_PAY_BANK_COUNTRIES:*}
        payouts: true
  billing:
    # Activate tiers from a bare product id, with no store receipt check.
    # LOCAL TESTING ONLY: real App Store / Play validation must replace this.
    trust-client: ${UNKITTERED_BILLING_TRUST_CLIENT:false}
  oauth:
    # Comma-separated OAuth client ids whose ID tokens we accept. Empty means
    # that provider is switched off (the endpoint answers 503).
    google:
      client-ids: ${UNKITTERED_GOOGLE_CLIENT_IDS:}
    apple:
      client-ids: ${UNKITTERED_APPLE_CLIENT_IDS:}
  jwt:
    # Override in production via UNKITTERED_JWT_SECRET. Must be >= 32 bytes.
    secret: ${UNKITTERED_JWT_SECRET:dev-only-change-me-please-32bytes-minimum-secret}
    # Access token lifetime in minutes
    access-ttl-minutes: ${UNKITTERED_JWT_TTL:10080}
  discover:
    cache-ttl-seconds: 60
    deck-size: 30
  firebase:
    # Service-account JSON for FCM push. Drop the file from the Firebase console
    # (Project settings → Service accounts → Generate new private key) at
    # src/main/resources/firebase-service-account.json, or point this at an
    # absolute path / env var. If absent, push is simply disabled (app still boots).
    credentials: ${FIREBASE_CREDENTIALS:classpath:firebase-service-account.json}
  queue:
    match-events: ${UNKITTERED_MATCH_QUEUE:unkittered-match-events}
  storage:
    # 'local' (disk, default for self-hosting) or 's3' (extension point, not yet wired).
    provider: ${UNKITTERED_STORAGE_PROVIDER:local}
    local:
      # Where uploaded files are written. Use an absolute path in production.
      dir: ${UNKITTERED_STORAGE_DIR:./uploads}
    # Base the client prepends to fetch files. Default is EMPTY → media URLs are
    # returned relative ("/files/<name>"), which the apps resolve against whatever
    # origin they're actually talking to (emulator, tunnel, LAN, prod) — no
    # host/port mismatch possible. Set this to an absolute CDN/host in production
    # if you serve media from a different origin than the API.
    public-base-url: ${UNKITTERED_PUBLIC_BASE_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.unkittered: DEBUG
